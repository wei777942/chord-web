<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>和弦移調上傳</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3d8bfd;
      --accent2: #2dd4a8;
      --danger: #f87171;
      --border: #2a3548;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1b2a44, transparent),
                  radial-gradient(900px 500px at 100% 0%, #13281f, transparent), var(--bg);
      color: var(--text); min-height: 100vh;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 2.5rem 1.25rem; }
    h1 { font-size: 1.6rem; margin: 0 0 .35rem; letter-spacing: .02em; }
    .sub { color: var(--muted); margin-bottom: 1.5rem; font-size: .95rem; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 1.4rem 1.35rem; box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }
    label { display: block; font-size: .85rem; color: var(--muted); margin: .9rem 0 .35rem; }
    input[type=password], select {
      width: 100%; padding: .7rem .8rem; border-radius: 8px;
      border: 1px solid var(--border); background: #0d121a; color: var(--text);
      font-size: 1rem;
    }
    .dropzone {
      margin-top: .35rem;
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 2.2rem 1.2rem;
      text-align: center;
      color: var(--muted);
      background: #0d121a;
      cursor: pointer;
      transition: border-color .15s, background .15s, color .15s;
      user-select: none;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .45rem;
    }
    .dropzone:hover { border-color: var(--accent); color: var(--text); }
    .dropzone.dragover {
      border-color: var(--accent2);
      background: rgba(45, 212, 168, .08);
      color: var(--accent2);
    }
    .dropzone.has-file { border-style: solid; border-color: var(--accent); color: var(--text); }
    .dropzone .dz-main { font-size: 1.05rem; font-weight: 500; }
    .dropzone .dz-name { font-size: .9rem; color: var(--accent2); word-break: break-all; }
    .dropzone input[type=file] {
      position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0,0,0,0);
    }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    button {
      margin-top: 1.25rem; width: 100%; padding: .85rem; border: 0; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #5b6cff); color: white;
      font-size: 1.05rem; font-weight: 600; cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    .err {
      background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.4);
      color: #fecaca; padding: .75rem 1rem; border-radius: 8px; margin-bottom: 1rem;
    }
    .hint { font-size: .8rem; color: var(--muted); margin-top: .5rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>樂譜和弦移調</h1>
    <p class="sub">上傳 PNG / JPG / PDF，選擇原調與目標調後送出處理。</p>
    <div class="card">
      {% if error %}
      <div class="err">{{ error }}</div>
      {% endif %}
      <form method="post" action="/upload" enctype="multipart/form-data" id="form">
        <label>樂譜檔案（最大 20MB）</label>
        <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="把譜拖進來">
          <div class="dz-main" id="dz-main">把譜拖進來（PNG / JPG / PDF）</div>
          <div class="dz-name" id="dz-name" hidden></div>
          <input type="file" id="file" name="file" accept=".png,.jpg,.jpeg,.pdf,image/png,image/jpeg,application/pdf" required>
        </div>

        <div class="row2">
          <div>
            <label for="from_key">原調</label>
            <select id="from_key" name="from_key">
              <option value="auto" selected>自動判斷</option>
              {% for k in keys %}<option value="{{ k }}">{{ k }}</option>{% endfor %}
            </select>
          </div>
          <div>
            <label for="to_key">目標調</label>
            <select id="to_key" name="to_key">
              {% for k in keys %}<option value="{{ k }}" {% if k == "G" %}selected{% endif %}>{{ k }}</option>{% endfor %}
            </select>
          </div>
        </div>

        <label for="password">存取密碼</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="請輸入共用密碼">

        <button type="submit">上傳並移調</button>
        <p class="hint">上傳後自動辨識並移調（約數十秒）。每個 IP 每小時最多 10 個任務。</p>
      </form>
    </div>
  </div>
  <script>
    (function () {
      const zone = document.getElementById('dropzone');
      const input = document.getElementById('file');
      const main = document.getElementById('dz-main');
      const nameEl = document.getElementById('dz-name');

      function setFile(file) {
        if (!file) return;
        const dt = new DataTransfer();
        dt.items.add(file);
        input.files = dt.files;
        zone.classList.add('has-file');
        main.textContent = '已選擇檔案';
        nameEl.hidden = false;
        nameEl.textContent = file.name;
      }

      zone.addEventListener('click', function (e) {
        if (e.target === input) return;
        input.click();
      });
      zone.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          input.click();
        }
      });
      input.addEventListener('change', function () {
        if (input.files && input.files[0]) setFile(input.files[0]);
      });
      zone.addEventListener('dragenter', function (e) {
        e.preventDefault(); e.stopPropagation();
        zone.classList.add('dragover');
      });
      zone.addEventListener('dragover', function (e) {
        e.preventDefault(); e.stopPropagation();
        zone.classList.add('dragover');
      });
      zone.addEventListener('dragleave', function (e) {
        e.preventDefault(); e.stopPropagation();
        if (!zone.contains(e.relatedTarget)) zone.classList.remove('dragover');
      });
      zone.addEventListener('drop', function (e) {
        e.preventDefault(); e.stopPropagation();
        zone.classList.remove('dragover');
        const files = e.dataTransfer && e.dataTransfer.files;
        if (files && files.length) setFile(files[0]);
      });
    })();
  </script>
</body>
</html>
